Pets:
  GoldenApple:
    item-info:
      material: GOLDEN_APPLE
  Mutton:
    item-info:
      material: MUTTON
  KranPet:
    tags: Kran, Pet, Combat
    variables:
      - 'killed_sheeps -> 0'
    upgrades:
      max-level: 200
      cost-per-level: 100
      message:
        progress:
          - '&cExp: &7%exp%/%cost%'
        maxed-progress:
          - '&c&lMAXED PET'
    exp:
      BLOCK_BREAK:
        - 'ALL -> 1'
    item-info:
      material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvN2M1OWVhZDAxZDk3OTIxY2ZmODk3MjlhMjg0YTljNGY1MTcyZDZiZjZmNmRkYjUzMTg0NzMyODlmMGU3YmZkYyJ9fX0=
      data: 0
      name: '&cKran &8| &fPet &7[Lvl. %level%]'
      lore:
        - '&8Combat Pet'
        - ''
        - '&6Golden'
        - '&7When you kill a player, there is a 50%'
        - '&7to drop a golden apple.'
        - '&8Level 100 to secure an golden apple.'
        - ''
        - '&bVenom'
        - '&7Chance of 2.5% to apply poison effect'
        - '&7to your opponent when you''re attacking him.'
        - '&cRequires 1000 killed sheeps to use this ability.'
        - ''
        - '&dRegenerator'
        - '&7When you attack you have &c%math_%level%*0.025%% &8to'
        - '&7to receive regeneration.'
        - ''
        - '&8Killing sheep give you double xp and extra mutton.'
        - '&cKilled Sheeps: %variable_{killed_sheeps}%'
        - ''
        - '%progress%'
    actions:
      default:
        KillerSheeps:
          event: PLAYER_KILLS
          requirements:
            - '[event] SHEEP'
          rewards:
            - '[CHANCE -> 100] MESSAGE -> &c&lKRAN! &aYou killed a sheep!.'
            - '[CHANCE -> 100] ADD_EXP -> 5'
            - '[CHANCE -> 100] SET_VARIABLE -> killed_sheeps::%math_%variable_{killed_sheeps}%+1%'
            - '[CHANCE -> 100] CANCEL_DROPS'
            - '[CHANCE -> 100] WORLD_DROP:TARGET -> Mutton[%rng_1,3%]'

        GoldenAbility:
          event: PLAYER_KILLS
          requirements:
            - '[event] PLAYER'
          rewards:
            - '[CHANCE -> 100] MESSAGE -> &c&lKRAN! &aYou killed a player, you have a chance to drop a Golden Apple.'
            - '[CHANCE -> 100] EXECUTE_ACTION -> GoldenMaxed'
        GoldenMaxed:
          cancel_action: true
          requirements:
            - '[eval] %level% >= 100'
          rewards:
            - '[CHANCE -> 100] WORLD_DROP:TARGET -> GoldenApple[1]'
          else:
            - '[CHANCE -> 100] EXECUTE_ACTION -> GoldenNoMaxed'
        GoldenNoMaxed:
          cancel_action: true
          rewards:
            - '[CHANCE -> 50] WORLD_DROP:TARGET -> GoldenApple[1]'

        Venom:
          event: PLAYER_ATTACK
          requirements:
            - '[event] PLAYER'
            - '[eval] %variable_{killed_sheeps}% >= 1000'
          rewards:
            - '[chance -> 2.5] EFFECT:TARGET -> POISON::3::1'

        RegeneratorOne:
          event: PLAYER_ATTACK
          requirements:
            - '[eval] %level% < 200'
          rewards:
            - '[CHANCE_PER_LEVEL -> 0.025] EFFECT -> REGENERATION::5::1'
          else:
            - '[CHANCE -> 100] EXECUTE_ACTION -> RegeneratorTwo'
        RegeneratorTwo:
          cancel_action: true
          rewards:
            - '[CHANCE_PER_LEVEL -> 0.025] EFFECT -> REGENERATION::5::1'